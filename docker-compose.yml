services:
  openclaw:
    build:
      context: .
    image: ${OPENCLAW_IMAGE:-openclaw-assistant:local}
    container_name: openclaw-assistant
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_PORT: "18789"
      OWNER_NAME: ${OWNER_NAME:-Owner}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Assistant}
      QUIET_HOURS: ${QUIET_HOURS:-22:00-07:00}
      OBSIDIAN_SUBDIR: ${OBSIDIAN_SUBDIR:-Assistant}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-opencode/claude-haiku-5-5}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      CITY: ${CITY:-}
      WORK_HOURS: ${WORK_HOURS:-09:00-17:00}
    volumes:
      - ${OPENCLAW_APPDATA:-/mnt/cache/appdata/openclaw-assistant}:/home/node/.openclaw
      - ${OBSIDIAN_HOST_PATH:-/mnt/user/Obsidian/YourVault}:/home/node/obsidian
    ports:
      - "18789:18789"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MEMORY_LIMIT:-1g}
    cpus: "2.0"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw-assistant:local}
    profiles:
      - cli
    network_mode: "service:openclaw"
    init: true
    user: "${PUID:-99}:${PGID:-100}"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      OWNER_NAME: ${OWNER_NAME:-Owner}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Assistant}
      QUIET_HOURS: ${QUIET_HOURS:-22:00-07:00}
      OBSIDIAN_SUBDIR: ${OBSIDIAN_SUBDIR:-Assistant}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-opencode/claude-haiku-5-5}
      CITY: ${CITY:-}
      WORK_HOURS: ${WORK_HOURS:-09:00-17:00}
    volumes:
      - ${OPENCLAW_APPDATA:-/mnt/cache/appdata/openclaw-assistant}:/home/node/.openclaw
      - ${OBSIDIAN_HOST_PATH:-/mnt/user/Obsidian/YourVault}:/home/node/obsidian
    entrypoint: ["node", "dist/index.js"]
    stdin_open: true
    tty: true
    depends_on:
      - openclaw
